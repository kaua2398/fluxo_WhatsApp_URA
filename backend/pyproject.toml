[project]
name = "flow-navigator-backend"
version = "1.0.0"
description = "Backend API for Flow Navigator - visual flow documentation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
